[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loptbench"
version = "0.1.0"
description = "Learned optimizers (VeLO) on the Differometor gravitational-wave detector benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Artificial Scientist Lab" }]
keywords = ["benchmark", "jax", "learned-optimizers", "optimization", "velo"]

dependencies = [
    "dfbench[optax]",
    # learned_optimization's own runtime needs. Its setup.py pins these to
    # 2021-era versions (dm-haiku==0.0.5, absl-py==0.12.0) which no longer
    # resolve, so it must be installed with --no-deps and its real
    # dependencies listed here instead. See README "Installation".
    "dm-haiku>=0.0.14",
    "flax>=0.10",
    "gin-config>=0.5.0",
    "chex>=0.1.85",
    "absl-py>=2.0",
    "numpy>=2.0",
    "tqdm",
]

[project.optional-dependencies]
# Needed only to run dfbench's own algorithms as baselines. dfbench's
# `algorithms/__init__.py` imports its whole zoo eagerly, so comparing against
# even plain Adam pulls in torch, evox, nevergrad and botorch.
baselines = ["dfbench[all]"]
test = ["pytest>=8", "pytest-timeout>=2.2"]

[project.urls]
Repository = "https://github.com/artificial-scientist-lab/LOptBench"

[tool.hatch.build.targets.wheel]
packages = ["src/loptbench"]
